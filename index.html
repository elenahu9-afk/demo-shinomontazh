<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо Севера — шиномонтаж в Северодвинске</title>
<meta name="description" content="Демо-версия сайта для шиномонтажа">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
body{margin:0}
a:hover{opacity:.88}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state = { radius: 0, theme: 0 };

function view() {

    // ДАННЫЕ МАСТЕРСКОЙ. Чтобы сделать сайт под клиента, меняется только этот блок
    // (название, город, контакты, часы, услуги и цены по трём группам размеров колёс).
    const shop = {
      name: 'Колесо Севера',
      cityIn: 'Северодвинске',
      phone: '+7 900 000-00-00',
      phoneHref: 'tel:+79000000000',
      telegram: 'https://t.me/',
      address: 'Северодвинск, ул. Примерная, 1',
      hours: 'Ежедневно 9:00–21:00',
      mapUrl: 'https://yandex.ru/maps/?text=' + encodeURIComponent('Северодвинск, ул. Примерная, 1')
    };
    const groups = [
      'R13–R15 · легковые',
      'R16–R17 · кроссоверы',
      'R18 и больше · внедорожники'
    ];
    const services = [
      { name: 'Замена 4 колёс «под ключ»', note: 'Снять, перебортовать, отбалансировать, установить', prices: [2200, 2800, 3600] },
      { name: 'Монтаж шины на диск', note: 'Цена за одно колесо', prices: [250, 330, 450] },
      { name: 'Балансировка колеса', note: 'Цена за одно колесо', prices: [200, 260, 350] },
      { name: 'Ремонт прокола', note: 'Жгутом, с проверкой давления', prices: [350, 350, 450] },
      { name: 'Хранение комплекта шин', note: 'За сезон, шины в упаковке', prices: [1800, 2200, 2800] }
    ];

    // ВАРИАНТЫ ОФОРМЛЕНИЯ: у каждой мастерской свой цвет. Для клиента оставляется один.
    const themes = [
      { label: 'Тёмный и янтарь', hero: '#14181D', deep: '#0B0E11', mid: '#1B2127', page: '#F2F4F6', accent: '#FFB400', dot: '#FFB400' },
      { label: 'Графит и оранжевый', hero: '#2A2A2E', deep: '#1A1A1D', mid: '#333338', page: '#F5F3F0', accent: '#FF6B2C', dot: '#FF6B2C' },
      { label: 'Лесной зелёный', hero: '#12332A', deep: '#0A211B', mid: '#183F34', page: '#F1F5F2', accent: '#3DDC97', dot: '#3DDC97' },
      { label: 'Синий', hero: '#12294A', deep: '#0A1A33', mid: '#173560', page: '#F0F4FA', accent: '#4DA3FF', dot: '#4DA3FF' }
    ];
    const ti = state.theme;
    const t = themes[ti];
    const themeTabs = themes.map((th, i) => ({
      label: th.label,
      pressed: i === ti ? 'true' : 'false',
      state: i === ti
        ? 'background:' + th.dot + ';color:#14181D;border:1px solid ' + th.dot + ';'
        : 'background:transparent;color:#C5CDD5;border:1px solid #5A656F;',
    }));

    const r = state.radius;
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';

    const tabs = groups.map((label, i) => ({
      label: label,
      pressed: i === r ? 'true' : 'false',
      state: i === r ? 'background:#14181D;color:#FFFFFF;' : 'background:#FFFFFF;color:#14181D;',
    }));
    const rows = services.map((s) => ({
      name: s.name,
      note: s.note,
      price: 'от ' + fmt(s.prices[r])
    }));

    
  const accent = t.accent;
  return `
<div style="font-family:'Golos Text',system-ui,sans-serif;color:#14181D;background:${t.page};line-height:1.5">

  <div style="background:${t.deep};color:#C5CDD5;font-size:13px;text-align:center;padding:8px 16px">Демо-версия сайта: название, телефон, адрес, цены и сроки условные</div>

  <div style="background:${t.deep};border-top:1px solid #2A323A;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px">
    <span style="color:#9AA5B0;font-size:13px">Варианты оформления:</span>
    ${themeTabs.map((th,i)=>`
      <button type="button" aria-pressed="${th.pressed}" data-theme="${i}" style="font-family:inherit;font-size:13px;font-weight:500;min-height:36px;padding:6px 14px;border-radius:999px;cursor:pointer;${th.state}">${th.label}</button>
    `).join('')}
  </div>

  <div style="background:${t.hero};color:#E8ECF0">
    <div style="max-width:1120px;margin:0 auto;padding:0 24px">

      <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:20px 0">
        <a href="#top" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#FFFFFF">
          <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="${t.deep}" stroke="#2A323A" stroke-width="2"></circle>
            <circle cx="20" cy="20" r="11" fill="none" stroke="${accent}" stroke-width="4"></circle>
            <circle cx="20" cy="20" r="3.5" fill="#FFFFFF"></circle>
          </svg>
          <span style="font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.04em;text-transform:uppercase">${shop.name}</span>
        </a>
        <nav style="display:flex;flex-wrap:wrap;align-items:center;gap:0 24px">
          <a href="#prices" style="color:#C5CDD5;text-decoration:none;font-size:15px;padding:12px 0">Цены</a>
          <a href="#services" style="color:#C5CDD5;text-decoration:none;font-size:15px;padding:12px 0">Услуги</a>
          <a href="#contacts" style="color:#C5CDD5;text-decoration:none;font-size:15px;padding:12px 0">Как проехать</a>
          <a href="${shop.phoneHref}" style="background:${accent};color:#14181D;font-weight:600;font-size:15px;text-decoration:none;padding:12px 20px;border-radius:8px">${shop.phone}</a>
        </nav>
      </header>

      <section id="top" style="display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding:48px 0 80px">
        <div style="flex:1 1 420px;min-width:0">
          <div style="display:inline-block;border:1px solid #3A434C;color:#C5CDD5;font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:20px">Сезон переобувки открыт</div>
          <h1 style="margin:0 0 20px;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1.08;text-transform:uppercase;color:#FFFFFF">Шиномонтаж в ${shop.cityIn}: поменяем колёса без очереди</h1>
          <p style="margin:0 0 32px;font-size:18px;color:#C5CDD5;max-width:520px">Сезонная замена резины, балансировка и ремонт проколов. Работаем по записи: вы приезжаете в своё время и уезжаете быстро.</p>
          <div style="display:flex;flex-wrap:wrap;gap:12px">
            <a href="${shop.phoneHref}" style="display:inline-flex;align-items:center;min-height:48px;box-sizing:border-box;padding:0 24px;background:${accent};color:#14181D;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px">Позвонить и записаться</a>
            <a href="${shop.telegram}" style="display:inline-flex;align-items:center;min-height:48px;box-sizing:border-box;padding:0 24px;border:1px solid #5A656F;color:#FFFFFF;font-weight:500;font-size:16px;text-decoration:none;border-radius:8px">Написать в Telegram</a>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:20px 40px;margin-top:40px">
            <div>
              <div style="font-size:13px;color:#9AA5B0">Режим работы</div>
              <div style="font-size:18px;font-weight:600;color:#FFFFFF">${shop.hours}</div>
            </div>
            <div>
              <div style="font-size:13px;color:#9AA5B0">Размеры колёс</div>
              <div style="font-size:18px;font-weight:600;color:#FFFFFF">R13–R22</div>
            </div>
            <div>
              <div style="font-size:13px;color:#9AA5B0">Оплата</div>
              <div style="font-size:18px;font-weight:600;color:#FFFFFF">Картой и наличными</div>
            </div>
          </div>
        </div>
        <div style="flex:1 1 280px;display:flex;justify-content:center">
          <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="max-width:100%;height:auto">
            <circle cx="160" cy="160" r="150" fill="${t.deep}" stroke="#2A323A" stroke-width="2"></circle>
            <circle cx="160" cy="160" r="134" fill="none" stroke="#2A323A" stroke-width="12" stroke-dasharray="6 10"></circle>
            <circle cx="160" cy="160" r="112" fill="${t.mid}"></circle>
            <circle cx="160" cy="160" r="96" fill="none" stroke="${accent}" stroke-width="10"></circle>
            <line x1="160" y1="160" x2="160" y2="70" stroke="#4A5560" stroke-width="14" stroke-linecap="round"></line>
            <line x1="160" y1="160" x2="245.6" y2="132.2" stroke="#4A5560" stroke-width="14" stroke-linecap="round"></line>
            <line x1="160" y1="160" x2="212.9" y2="232.8" stroke="#4A5560" stroke-width="14" stroke-linecap="round"></line>
            <line x1="160" y1="160" x2="107.1" y2="232.8" stroke="#4A5560" stroke-width="14" stroke-linecap="round"></line>
            <line x1="160" y1="160" x2="74.4" y2="132.2" stroke="#4A5560" stroke-width="14" stroke-linecap="round"></line>
            <circle cx="160" cy="160" r="26" fill="${t.deep}" stroke="${accent}" stroke-width="4"></circle>
          </svg>
        </div>
      </section>

    </div>
  </div>

  <section id="prices" style="max-width:1120px;margin:0 auto;padding:72px 24px 24px">
    <h2 style="margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,4vw,40px);text-transform:uppercase">Цены на шиномонтаж</h2>
    <p style="margin:0 0 28px;color:#4A5560;font-size:17px;max-width:640px">Выберите размер колёс, и цены пересчитаются. Точную сумму назовём при записи.</p>
    <div role="group" aria-label="Размер колёс" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px">
      ${tabs.map((tab,i)=>`
        <button type="button" aria-pressed="${tab.pressed}" data-radius="${i}" style="font-family:inherit;font-size:15px;font-weight:500;min-height:44px;padding:10px 18px;border-radius:8px;cursor:pointer;border:1px solid #14181D;${tab.state}">${tab.label}</button>
      `).join('')}
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:#E1E6EB;border:1px solid #E1E6EB;border-radius:12px;overflow:hidden">
      ${rows.map((row,i)=>`
        <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 24px;padding:18px 24px;background:#FFFFFF">
          <div style="flex:1 1 280px;min-width:0">
            <div style="font-weight:600;font-size:17px">${row.name}</div>
            <div style="color:#4A5560;font-size:14px">${row.note}</div>
          </div>
          <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;white-space:nowrap">${row.price}</div>
        </div>
      `).join('')}
    </div>
  </section>

  <section id="services" style="max-width:1120px;margin:0 auto;padding:72px 24px 24px">
    <h2 style="margin:0 0 28px;font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,4vw,40px);text-transform:uppercase">Что мы делаем</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">

      <div style="background:#FFFFFF;border:1px solid #E1E6EB;border-radius:12px;padding:24px">
        <div style="width:48px;height:48px;border-radius:10px;background:${accent};display:flex;align-items:center;justify-content:center;margin-bottom:16px">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#14181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 3v6M12 15v6M3 12h6M15 12h6"></path>
          </svg>
        </div>
        <h3 style="margin:0 0 8px;font-size:18px">Сезонная замена</h3>
        <p style="margin:0;color:#4A5560;font-size:15px">Снимем, поменяем и установим колёса. Болты затянем динамометрическим ключом.</p>
      </div>

      <div style="background:#FFFFFF;border:1px solid #E1E6EB;border-radius:12px;padding:24px">
        <div style="width:48px;height:48px;border-radius:10px;background:${accent};display:flex;align-items:center;justify-content:center;margin-bottom:16px">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#14181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path>
            <circle cx="16" cy="7" r="2"></circle>
            <circle cx="8" cy="17" r="2"></circle>
          </svg>
        </div>
        <h3 style="margin:0 0 8px;font-size:18px">Балансировка</h3>
        <p style="margin:0;color:#4A5560;font-size:15px">Уберём вибрацию на руле, особенно заметную после замены резины.</p>
      </div>

      <div style="background:#FFFFFF;border:1px solid #E1E6EB;border-radius:12px;padding:24px">
        <div style="width:48px;height:48px;border-radius:10px;background:${accent};display:flex;align-items:center;justify-content:center;margin-bottom:16px">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#14181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v8M8 12h8"></path>
          </svg>
        </div>
        <h3 style="margin:0 0 8px;font-size:18px">Ремонт проколов</h3>
        <p style="margin:0;color:#4A5560;font-size:15px">Устраним прокол и проверим давление, чтобы вы поехали дальше без сюрпризов.</p>
      </div>

      <div style="background:#FFFFFF;border:1px solid #E1E6EB;border-radius:12px;padding:24px">
        <div style="width:48px;height:48px;border-radius:10px;background:${accent};display:flex;align-items:center;justify-content:center;margin-bottom:16px">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#14181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8l9-5 9 5v9l-9 5-9-5z"></path>
            <path d="M3 8l9 5 9-5M12 13v9"></path>
          </svg>
        </div>
        <h3 style="margin:0 0 8px;font-size:18px">Хранение шин</h3>
        <p style="margin:0;color:#4A5560;font-size:15px">Упакуем комплект и сохраним до следующего сезона.</p>
      </div>

    </div>
  </section>

  <section style="max-width:1120px;margin:0 auto;padding:72px 24px 24px">
    <h2 style="margin:0 0 28px;font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,4vw,40px);text-transform:uppercase">Как записаться</h2>
    <div style="display:flex;flex-wrap:wrap;gap:24px">

      <div style="flex:1 1 260px;min-width:0;display:flex;gap:16px;align-items:flex-start">
        <div style="flex:none;width:44px;height:44px;border-radius:50%;background:${accent};color:#14181D;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center">1</div>
        <div>
          <div style="font-weight:600;font-size:18px;margin-bottom:4px">Позвоните или напишите</div>
          <div style="color:#4A5560;font-size:15px">Назовите дату и размер колёс, и мы подберём удобное время.</div>
        </div>
      </div>

      <div style="flex:1 1 260px;min-width:0;display:flex;gap:16px;align-items:flex-start">
        <div style="flex:none;width:44px;height:44px;border-radius:50%;background:${accent};color:#14181D;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center">2</div>
        <div>
          <div style="font-weight:600;font-size:18px;margin-bottom:4px">Приезжайте в своё время</div>
          <div style="color:#4A5560;font-size:15px">Работаем по записи, поэтому вы не стоите в очереди.</div>
        </div>
      </div>

      <div style="flex:1 1 260px;min-width:0;display:flex;gap:16px;align-items:flex-start">
        <div style="flex:none;width:44px;height:44px;border-radius:50%;background:${accent};color:#14181D;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center">3</div>
        <div>
          <div style="font-weight:600;font-size:18px;margin-bottom:4px">Забирайте и платите</div>
          <div style="color:#4A5560;font-size:15px">Покажем, что сделано, и примем оплату картой или наличными.</div>
        </div>
      </div>

    </div>
  </section>

  <section id="contacts" style="max-width:1120px;margin:0 auto;padding:72px 24px 80px">
    <h2 style="margin:0 0 28px;font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,4vw,40px);text-transform:uppercase">Как нас найти</h2>
    <div style="display:flex;flex-wrap:wrap;gap:32px">

      <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px">
        <div>
          <div style="font-size:14px;color:#4A5560">Адрес</div>
          <div style="font-size:19px;font-weight:600">${shop.address}</div>
        </div>
        <div>
          <div style="font-size:14px;color:#4A5560">Часы работы</div>
          <div style="font-size:19px;font-weight:600">${shop.hours}</div>
        </div>
        <div>
          <div style="font-size:14px;color:#4A5560">Телефон</div>
          <a href="${shop.phoneHref}" style="font-size:19px;font-weight:600;color:#14181D;text-decoration:none">${shop.phone}</a>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <a href="${shop.mapUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;min-height:48px;box-sizing:border-box;padding:0 24px;background:${accent};color:#14181D;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px">Открыть на карте</a>
          <a href="${shop.telegram}" style="display:inline-flex;align-items:center;min-height:48px;box-sizing:border-box;padding:0 24px;border:1px solid #14181D;color:#14181D;font-weight:500;font-size:16px;text-decoration:none;border-radius:8px">Написать в Telegram</a>
        </div>
      </div>

      <div role="img" aria-label="Схема проезда" style="flex:1 1 360px;min-height:300px;position:relative;overflow:hidden;border-radius:12px;background:#E3E8ED">
        <svg viewBox="0 0 400 280" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%">
          <path d="M0 250 C100 220 200 270 400 240" fill="none" stroke="#C9DDEF" stroke-width="26"></path>
          <path d="M-10 200 L410 120" fill="none" stroke="#FFFFFF" stroke-width="14"></path>
          <path d="M-10 60 L410 82" fill="none" stroke="#FFFFFF" stroke-width="8"></path>
          <path d="M150 -10 L230 290" fill="none" stroke="#FFFFFF" stroke-width="12"></path>
          <path d="M320 -10 L300 290" fill="none" stroke="#FFFFFF" stroke-width="7"></path>
          <path d="M200 178 C186 158 176 148 176 134 a24 24 0 0 1 48 0 C224 148 214 158 200 178 Z" fill="${accent}" stroke="#14181D" stroke-width="3"></path>
          <circle cx="200" cy="134" r="8" fill="#14181D"></circle>
        </svg>
        <div style="position:absolute;left:16px;bottom:16px;background:#FFFFFF;border-radius:8px;padding:8px 12px;font-size:14px;color:#14181D">Схема проезда появится здесь</div>
      </div>

    </div>
  </section>

  <footer style="background:${t.deep};color:#9AA5B0;font-size:14px;padding:28px 24px">
    <div style="max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px">
      <span>© 2026 ${shop.name}</span>
      <span>Демо-версия сайта</span>
    </div>
  </footer>

</div>
`;
}

function render() {
  document.getElementById('app').innerHTML = view();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.theme !== undefined) { state.theme = +b.dataset.theme; render(); }
  if (b.dataset.radius !== undefined) { state.radius = +b.dataset.radius; render(); }
});

render();
</script>
</body>
</html>
